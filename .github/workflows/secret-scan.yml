name: Secret Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # gitleaks CLI is free/OSS. We invoke the binary directly instead of
  # gitleaks/gitleaks-action, which requires a paid GITLEAKS_LICENSE for orgs.
  GITLEAKS_VERSION: "8.21.2"

jobs:
  scan:
    name: "Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git . --config .gitleaks.toml --redact -v --log-opts="${BASE_SHA}..${HEAD_SHA}"
